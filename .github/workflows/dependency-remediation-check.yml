# Fast, self-contained validation for Python dependency changes (including
# automated remediation PRs). It is intentionally narrower than the upstream
# `check-python-deps` workflow: no change-detector action, no backend setup, and
# no test suite — just the two checks that catch an inconsistent dependency
# state.
#
# What it validates:
#   1. Lock freshness: `./scripts/uv-pip-compile.sh` (the repository's existing
#      dependency tooling, run in the pinned Python Docker image) regenerates
#      requirements/*.txt and the job fails if the result differs from what the
#      PR committed, ignoring comment-only and whitespace-only diffs.
#   2. Declared-constraint consistency: `scripts/check_pinned_extras.py` asserts
#      that every pin in requirements/base.txt and requirements/development.txt
#      satisfies the specifiers declared in pyproject.toml, including
#      optional-dependency extras. Extras are not inputs to the compile in (1),
#      so a transitively pinned package can contradict an extra while the
#      recompile stays green (this is the xlrd case: pinned 2.0.1 vs.
#      `excel = ["xlrd>=2.0.2, <2.1"]`).
#
# Limitations:
#   - It does not install the resolved dependency set, import Superset, or run
#     any tests, so it cannot detect runtime or behavioural breakage from a
#     version bump.
#   - It does not check the frontend (npm) dependency graph, Docker images, or
#     helm charts, and performs no vulnerability scanning.
#   - Constraint checking is static: it compares pinned versions against
#     declared specifiers only, and skips requirements carrying an environment
#     marker. Conflicts that only surface during full extra resolution (e.g.
#     two extras whose transitive requirements disagree) are out of scope.
#   - Resolution output depends on the Python version and platform, so the
#     recompile runs in the same `python:<current>-slim` image the contributor
#     tooling uses; changes to that image can shift results.
name: Dependency remediation check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "pyproject.toml"
      - "requirements/**"
      - "scripts/uv-pip-compile.sh"
      - "scripts/check_pinned_extras.py"
      - ".github/workflows/dependency-remediation-check.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate-python-deps:
    runs-on: ubuntu-26.04
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install checker dependencies
        run: pip install packaging

      - name: Check pins against pyproject.toml specifiers
        run: python scripts/check_pinned_extras.py

      - name: Regenerate pinned requirements
        run: ./scripts/uv-pip-compile.sh

      - name: Check for uncommitted changes
        run: |
          echo "Full diff (for logging/debugging):"
          git diff

          filtered_diff=$(git diff -U0 | grep '^[-+]' | grep -vE '^[-+]{3}' | grep -vE '^[-+][[:space:]]*#' | grep -vE '^[-+][[:space:]]*$' || true)

          if [[ -n "$filtered_diff" ]]; then
            echo
            echo "ERROR: The pinned dependencies are not up-to-date."
            echo "Please run './scripts/uv-pip-compile.sh' and commit the changes."
            exit 1
          fi
          echo "Pinned dependencies are up-to-date."
